<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-GP Observer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0d;
      --panel: #11151a;
      --line: #293039;
      --muted: #8f9aa6;
      --text: #f2f5f7;
      --orange: #ff4d00;
      --green: #47d782;
      --red: #ff5e6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(8, 10, 13, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    .statuses { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
    }
    .chip.live { color: var(--green); border-color: #245f3c; }
    .chip.dead { color: var(--red); border-color: #6b2830; }
    button {
      padding: 6px 10px;
      border: 1px solid #245f3c;
      border-radius: 6px;
      background: #12251a;
      color: var(--green);
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .4; cursor: default; }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 1.2fr) minmax(320px, .8fr);
      gap: 14px;
      padding: 14px;
    }
    section {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    h2 {
      margin: 0;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .camera {
      display: grid;
      min-height: 360px;
      place-items: center;
      background: #000;
    }
    .camera img { display: block; width: 100%; height: auto; }
    .meta, .race-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1px;
      background: var(--line);
    }
    .datum { min-height: 64px; padding: 10px 12px; background: var(--panel); }
    .datum label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }
    .datum strong { font-size: 14px; overflow-wrap: anywhere; }
    .messages { max-height: 630px; overflow: auto; }
    details { border-bottom: 1px solid var(--line); }
    summary {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 13px;
      cursor: pointer;
    }
    summary span:last-child { color: var(--muted); }
    pre {
      margin: 0;
      padding: 10px 13px 16px;
      overflow: auto;
      color: #c8d0d8;
      font-size: 11px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #171c22; color: var(--muted); }
    .wide { grid-column: 1 / -1; }
    .empty { padding: 28px; color: var(--muted); text-align: center; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI-GP / PILOT VIEW</h1>
    <div class="statuses">
      <span id="backend" class="chip">SIM UNKNOWN</span>
      <span id="lifecycle" class="chip">WAITING</span>
      <span id="mav" class="chip">MAVLINK WAITING</span>
      <span id="cam" class="chip">CAMERA WAITING</span>
      <span id="uptime" class="chip">0s</span>
      <button id="reset" type="button" disabled>RESET EPISODE</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Onboard FPV camera</h2>
      <div class="camera"><img src="/stream.mjpg" alt="Latest onboard FPV camera frame"></div>
      <div id="camera-meta" class="meta"></div>
    </section>
    <section>
      <h2>Race state</h2>
      <div id="race" class="race-grid"></div>
      <h2>Latest MAVLink messages</h2>
      <div id="messages" class="messages"><div class="empty">Waiting for telemetry…</div></div>
    </section>
    <section class="wide">
      <h2>Official control and observation surfaces</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Direction</th><th>Surface</th><th>Rate</th><th>Fields</th><th>Availability</th></tr></thead>
          <tbody id="surfaces"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const text = value => value === null || value === undefined ? "—" : String(value);
    let monitorUptimeBase = 0;
    let monitorUptimeSampledAt = performance.now();
    function chip(node, live, liveText, deadText) {
      node.className = "chip " + (live ? "live" : "dead");
      node.textContent = live ? liveText : deadText;
    }
    function dataGrid(node, data) {
      node.replaceChildren(...Object.entries(data).map(([key, value]) => {
        const box = document.createElement("div");
        box.className = "datum";
        const label = document.createElement("label");
        label.textContent = key.replaceAll("_", " ");
        const strong = document.createElement("strong");
        strong.textContent = text(value);
        box.append(label, strong);
        return box;
      }));
    }
    function renderMessages(messages) {
      const expanded = new Set(
        [...$("messages").querySelectorAll("details[open]")].map(item => item.dataset.name)
      );
      const names = Object.keys(messages).sort();
      if (!names.length) {
        $("messages").innerHTML = '<div class="empty">Waiting for telemetry…</div>';
        return;
      }
      $("messages").replaceChildren(...names.map(name => {
        const item = messages[name];
        const details = document.createElement("details");
        details.dataset.name = name;
        details.open = expanded.has(name);
        const summary = document.createElement("summary");
        const title = document.createElement("span");
        title.textContent = name;
        const meta = document.createElement("span");
        meta.textContent = `${item.count} packets • ${item.rate_hz} Hz • ${item.age_ms} ms`;
        summary.append(title, meta);
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(item.fields, null, 2);
        details.append(summary, pre);
        return details;
      }));
    }
    function renderSurfaces(surfaces) {
      if ($("surfaces").childElementCount) return;
      $("surfaces").replaceChildren(...surfaces.map(surface => {
        const row = document.createElement("tr");
        ["direction", "surface", "rate", "fields", "availability"].forEach(key => {
          const cell = document.createElement("td");
          cell.textContent = surface[key];
          row.append(cell);
        });
        return row;
      }));
    }
    async function update() {
      try {
        const response = await fetch("/api/state", {cache: "no-store"});
        const state = await response.json();
        $("backend").textContent = `SIM ${state.simulator.backend.toUpperCase()}`;
        const ready = ["physics_ready", "running"].includes(state.simulator.lifecycle);
        $("reset").disabled = !ready;
        chip(
          $("lifecycle"),
          ready,
          state.simulator.lifecycle.toUpperCase(),
          state.simulator.lifecycle.toUpperCase()
        );
        chip($("mav"), state.monitor.mavlink_live, "MAVLINK LIVE", "MAVLINK WAITING");
        chip($("cam"), state.monitor.camera_live, "CAMERA LIVE", "CAMERA WAITING");
        monitorUptimeBase = state.monitor.uptime_s;
        monitorUptimeSampledAt = performance.now();
        dataGrid($("camera-meta"), {
          frame_id: state.camera.frame_id,
          resolution: state.camera.width ? `${state.camera.width} × ${state.camera.height}` : null,
          fps: state.camera.fps ? state.camera.fps.toFixed(1) : null,
          jpeg_bytes: state.camera.jpeg_size,
          sim_time_ns: state.camera.sim_time_ns,
          age_ms: state.camera.age_ms
        });
        dataGrid($("race"), state.race);
        renderMessages(state.messages);
        renderSurfaces(state.control_surfaces);
      } catch (error) {
        chip($("mav"), false, "", "MONITOR OFFLINE");
      }
    }
    function updateClock() {
      const elapsed = (performance.now() - monitorUptimeSampledAt) / 1000;
      $("uptime").textContent = `${Math.floor(monitorUptimeBase + elapsed)}s`;
    }
    async function resetEpisode() {
      $("reset").disabled = true;
      await fetch("/api/sim/reset", {method: "POST"});
      await update();
    }
    $("reset").addEventListener("click", resetEpisode);
    update();
    updateClock();
    setInterval(update, 250);
    setInterval(updateClock, 100);
  </script>
</body>
</html>
